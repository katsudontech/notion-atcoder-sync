name: Sync Notion to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # Every hour, not at the congested top of the hour

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Notion tree
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          ROOT_PAGE_ID: 3e29b429-9e61-816a-96ca-d16cbd4d2ca4
        run: python sync_notion.py
      - name: Commit changes only when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all notes/
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'docs: sync Notion snippets'
          git push
